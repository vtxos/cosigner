name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded push's run is not worth finishing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The crates' tests, on the host. They do not reach the released bytes, so the host's protoc is
  # good enough here.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml is the toolchain; this installs it.
      - run: rustup show
      # The cosigner's and ark's build scripts generate protobuf code.
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            cosigner -> target
            crates/threshold -> target
            crates/enclave-client -> target
            crates/escrow-service -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: make test

  # The component exactly as a release builds it, with nothing from the runner in it but Nix. Its
  # sha256 is printed so a run can be compared with a release, or with a build of your own.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: make cosigner-wasm
      - uses: actions/upload-artifact@v4
        with:
          name: cosigner.wasm
          path: result/bin/cosigner.wasm
